name: reacquire_paraphrase
# The speaker paraphrases line 9 (one word swapped, two added), then reads line 10 as
# written. The cursor follows through the paraphrase and never runs ahead of the speaker.
script: |
  Hey everyone, thanks for joining today.
  I want to talk about where we are headed.
  Last quarter was harder than we planned.
  Revenue came in under our forecast,
  and our costs grew faster than our sales.
  So we made some changes this month.
  We are building a smaller, sharper team.
  We are building it to last for years.
  Every person here was chosen on purpose.
  Our customers will feel the difference first.
  Support tickets get answered within a day.
  Bugs get fixed on a sixty-day clock.
  Here is what I need from each of you.
  Bring me problems early, not late.
  Thanks for listening, and let's get to work.
start_unit: 64
events:
  - {speak: "our customers are going to feel the difference first", label: para}
  - {speak: "support tickets get answered within a day", label: read}
expect:
  - {during: para, unit_max: 71}
  - {at: para, unit: 71}
  - {at_word: 2, of: read, unit: 73}
  - {at: end, unit: 78, committed: 78}
invariants: [no_backward_without_key, provisional_ge_committed]
